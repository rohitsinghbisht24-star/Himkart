<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Parser & Interactive Checklist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">OrderParser Pro</h1>
                    <p class="text-xs text-slate-500">Extract, Parse, and Checklist Generator</p>
                </div>
            </div>
            <button onclick="loadSampleData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-3 py-2 rounded-lg transition border border-slate-200">
                <i class="fa-solid fa-wand-magic-sparkles mr-1 text-indigo-500"></i> Load Sample Text
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-6 flex-grow grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Input Section -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-3">
                    <label for="rawInput" class="block text-sm font-semibold text-slate-700">
                        <i class="fa-solid fa-pen-to-square text-indigo-500 mr-1.5"></i> Raw Order Input
                    </label>
                    <span class="text-xs text-slate-400">Auto-parses on change</span>
                </div>
                <textarea id="rawInput" rows="6" 
                    class="w-full p-3.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    placeholder="Paste your text here... e.g., 01/10/2026Brandon irwinKaju Katli (250g) x2; Motichoor Ladoo (4pc) x2; ..."></textarea>
            </div>
            
            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
                <span id="statusMessage" class="text-xs text-emerald-600 font-medium hidden">
                    <i class="fa-solid fa-circle-check mr-1"></i> Parsed successfully!
                </span>
                <button onclick="parseOrderText()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                    <span>Parse and Generate</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </section>

        <!-- Parsed Results & Checklist Output -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-semibold text-slate-700">
                        <i class="fa-solid fa-clipboard-list text-indigo-500 mr-1.5"></i> Interactive Checklist
                    </h2>
                    <div id="badgeContainer" class="hidden flex space-x-2">
                        <span id="dateBadge" class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-medium"></span>
                        <span id="nameBadge" class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-full font-medium"></span>
                    </div>
                </div>

                <!-- Checklist Area -->
                <div id="checklistContainer" class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 min-h-[160px] max-h-[220px] overflow-y-auto space-y-2">
                    <p class="text-xs text-slate-400 text-center py-10">No items generated yet. Paste text and click parse.</p>
                </div>
            </div>

            <!-- Export Buttons -->
            <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-2">
                <button onclick="copyForGoogleKeep()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 border border-slate-200">
                    <i class="fa-regular fa-square-check text-indigo-600"></i>
                    <span>Copy for Keep `[ ]`</span>
                </button>
                <button onclick="copyForGoogleDocs()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 border border-slate-200">
                    <i class="fa-solid fa-list-check text-indigo-600"></i>
                    <span>Copy for Docs `☐`</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Footer Notice -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white">
        Order Parser Tool • Supports comma `,` and semicolon `;` delimiters
    </footer>

    <!-- Custom Message Box Modal -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2 text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastText">Copied to clipboard!</span>
    </div>

    <!-- JavaScript Parser & Logic -->
    <script>
        // Sample dataset loader
        function loadSampleData() {
            const sample = "01/10/2026Brandon irwinKaju Katli (250g) x2; Motichoor Ladoo (4pc) x2; Pure Chocolate Barfi (500g) x2; Sprite (2L) x1;";
            document.getElementById('rawInput').value = sample;
            parseOrderText();
        }

        // Real-time live listening
        document.getElementById('rawInput').addEventListener('input', function() {
            parseOrderText();
        });

        function parseOrderText() {
            const rawText = document.getElementById('rawInput').value.trim();
            const container = document.getElementById('checklistContainer');
            const badgeContainer = document.getElementById('badgeContainer');
            const dateBadge = document.getElementById('dateBadge');
            const nameBadge = document.getElementById('nameBadge');
            const statusMsg = document.getElementById('statusMessage');

            if (!rawText) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-10">No items generated yet. Paste text and click parse.</p>';
                badgeContainer.classList.add('hidden');
                statusMsg.classList.add('hidden');
                return;
            }

            // Extract Date (Pattern DD/MM/YYYY)
            const dateRegex = /\b\d{2}\/\d{2}\/\d{4}\b/;
            const dateMatch = rawText.match(dateRegex);
            const extractedDate = dateMatch ? dateMatch[0] : "Not found";

            let textAfterDate = rawText;
            if (dateMatch) {
                textAfterDate = rawText.replace(dateMatch[0], '').trim();
            }

            // Extract Name
            let extractedName = "Valued Customer";
            const nameMatch = textAfterDate.match(/^([A-Za-z\s]+?)(?=\b[A-Za-z\s]+\(\d+[a-zA-Z]+\)|\b[A-Za-z\s]+\s*x\d+|\b[A-Za-z\s]+\d+pc)/);
            
            if (nameMatch && nameMatch[1].trim().length > 1) {
                extractedName = nameMatch[1].trim();
            } else {
                const potentialName = textAfterDate.split(/[\(\;]/)[0].trim();
                if (potentialName && potentialName.length > 1) {
                    extractedName = potentialName;
                }
            }

            // Extract Items
            let itemsString = textAfterDate;
            if (extractedName && extractedName !== "Valued Customer") {
                itemsString = itemsString.replace(extractedName, '').trim();
            }

            let rawItems = itemsString.split(/[;,]/).map(item => item.trim()).filter(item => item);

            if (rawItems.length === 0) {
                rawItems = rawText.split(';').map(i => i.trim()).filter(i => i);
            }

            const items = rawItems.filter(item => {
                if (item === extractedDate || item.toLowerCase() === extractedName.toLowerCase()) return false;
                return item.length > 1;
            });

            // Update UI Badges
            if (extractedDate !== "Not found") {
                dateBadge.innerHTML = `<i class="fa-regular fa-calendar mr-1"></i> ${extractedDate}`;
                dateBadge.classList.remove('hidden');
            } else {
                dateBadge.classList.add('hidden');
            }

            if (extractedName) {
                nameBadge.innerHTML = `<i class="fa-regular fa-user mr-1"></i> ${extractedName}`;
                nameBadge.classList.remove('hidden');
            }
            badgeContainer.classList.remove('hidden');
            statusMsg.classList.remove('hidden');

            // Render Checklist HTML with Checkboxes moved to the right side
            if (items.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-10">Could not detect specific items. Check separators (; or ,).</p>';
                return;
            }

            container.innerHTML = '';
            items.forEach((itemText, index) => {
                let cleanItem = itemText.replace(/^[\s,-]+/, '').trim();
                if (!cleanItem) return;

                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between bg-white p-2.5 rounded-lg border border-slate-200/80 shadow-2xs hover:border-indigo-200 transition group cursor-pointer";
                
                // Item text on the left, checkbox on the right
                itemDiv.innerHTML = `
                    <label for="item-${index}" class="text-sm text-slate-700 font-medium cursor-pointer select-none flex-grow group-hover:text-slate-900 pr-3">${cleanItem}</label>
                    <input type="checkbox" id="item-${index}" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer">
                `;
                
                // Add interactive cross-out when checked
                const checkbox = itemDiv.querySelector('input');
                const label = itemDiv.querySelector('label');
                checkbox.addEventListener('change', function() {
                    if (this.checked) {
                        label.classList.add('line-through', 'text-slate-400');
                    } else {
                        label.classList.remove('line-through', 'text-slate-400');
                    }
                });

                container.appendChild(itemDiv);
            });
        }

        // Helper to retrieve current parsed items array for exporting
        function getExtractedDataForExport() {
            const dateText = document.getElementById('dateBadge').innerText.trim();
            const nameText = document.getElementById('nameBadge').innerText.trim();
            
            const itemLabels = document.querySelectorAll('#checklistContainer label');
            let items = [];
            itemLabels.forEach(lbl => items.push(lbl.innerText));
            return { dateText, nameText, items };
        }

        // Copy for Google Keep (Markdown Brackets `[ ]`)
        function copyForGoogleKeep() {
            const data = getExtractedDataForExport();
            if (data.items.length === 0) {
                showToast("No items to copy!");
                return;
            }

            let textToCopy = "";
            if (data.dateText) textToCopy += `Date: ${data.dateText}\n`;
            if (data.nameText) textToCopy += `Name: ${data.nameText}\n\n`;
            
            data.items.forEach(item => {
                textToCopy += `[ ] ${item}\n`;
            });

            copyToClipboard(textToCopy, "Copied formatted for Google Keep!");
        }

        // Copy for Google Docs (Symbol Checkbox `☐`)
        function copyForGoogleDocs() {
            const data = getExtractedDataForExport();
            if (data.items.length === 0) {
                showToast("No items to copy!");
                return;
            }

            let textToCopy = "";
            if (data.dateText) textToCopy += `Date: ${data.dateText}\n`;
            if (data.nameText) textToCopy += `Name: ${data.nameText}\n\n`;
            
            data.items.forEach(item => {
                textToCopy += `☐ ${item}\n`;
            });

            copyToClipboard(textToCopy, "Copied formatted with checkboxes!");
        }

        // Reliable Fallback Copy Engine
        function copyToClipboard(text, successMessage) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(successMessage);
                } else {
                    showToast("Failed to copy text.");
                }
            } catch (err) {
                showToast("Clipboard error.");
            }

            document.body.removeChild(textarea);
        }

        // Toast notification handler
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Run initial parse on load if sample is ready
        window.onload = function() {
            loadSampleData();
        };
    </script>
</body>
</html>
